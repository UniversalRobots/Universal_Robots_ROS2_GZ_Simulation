name: Kilted Semi Binary Main
on:
  workflow_dispatch:
  pull_request:
    branches:
      - jazzy
  push:
    branches:
      - jazzy
  schedule:
    - cron: '13 4 * * *'

jobs:
  kilted_semi_binary_main:
    uses: ./.github/workflows/reusable_ici.yml
    with:
      ros_distro: kilted
      ros_repo: main
      ref_for_scheduled_build: jazzy
      upstream_workspace: ur_simulation_gz.kilted.repos
